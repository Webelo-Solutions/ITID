<title>ITID Taxonomy Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f4f5f9;
    --surface:#ffffff;
    --surface-alt:#eceef4;
    --border:#dadfea;
    --border-strong:#c2c9d8;
    --text:#1a1f2e;
    --muted:#5c6478;
    --faint:#8890a2;
    --accent:#3454d1;
    --accent-strong:#22337e;
    --accent-soft:#e8ecfd;
    --accent-soft-2:#dbe2fb;
    --good:#1a7f5a;
    --good-soft:#e3f6ee;
    --warn:#a5690a;
    --warn-soft:#fbeed9;
    --bad:#c23a3a;
    --bad-soft:#fce7e7;
    --shadow: 0 1px 2px rgba(20,25,50,.06), 0 6px 20px rgba(20,25,50,.06);
    --code-font: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --body-font: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    --read-font: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0f17;
      --surface:#131826;
      --surface-alt:#0f1420;
      --border:#262e42;
      --border-strong:#37415c;
      --text:#e7e9f3;
      --muted:#9aa2ba;
      --faint:#6e7690;
      --accent:#7690ff;
      --accent-strong:#aebbff;
      --accent-soft:#1c2444;
      --accent-soft-2:#232c53;
      --good:#4fd3a0;
      --good-soft:#123227;
      --warn:#f0b559;
      --warn-soft:#3a2c11;
      --bad:#f2807d;
      --bad-soft:#3a1a1a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0f17;
    --surface:#131826;
    --surface-alt:#0f1420;
    --border:#262e42;
    --border-strong:#37415c;
    --text:#e7e9f3;
    --muted:#9aa2ba;
    --faint:#6e7690;
    --accent:#7690ff;
    --accent-strong:#aebbff;
    --accent-soft:#1c2444;
    --accent-soft-2:#232c53;
    --good:#4fd3a0;
    --good-soft:#123227;
    --warn:#f0b559;
    --warn-soft:#3a2c11;
    --bad:#f2807d;
    --bad-soft:#3a1a1a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--body-font);
    height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  ::selection{ background:var(--accent-soft-2); }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:20px;
    padding:12px 20px; border-bottom:1px solid var(--border);
    background:var(--surface); flex:0 0 auto;
  }
  .brand{ display:flex; align-items:baseline; gap:9px; white-space:nowrap; }
  .brand .mark{
    font-family:var(--code-font); font-weight:600; font-size:13px;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-soft-2);
    padding:3px 7px; border-radius:5px; letter-spacing:.02em;
  }
  .brand h1{ font-size:16.5px; font-weight:800; margin:0; letter-spacing:-.01em; }
  .brand .sub{ font-size:12px; color:var(--faint); }

  .stats{ display:flex; gap:6px; margin-left:8px; }
  .stat-chip{
    font-family:var(--code-font); font-size:11px; color:var(--muted);
    background:var(--surface-alt); border:1px solid var(--border);
    padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .stat-chip b{ color:var(--text); font-weight:600; }
  .stats{ display:none; }
  @media (min-width:980px){ .stats{ display:flex; } }

  .search-wrap{ position:relative; flex:1 1 auto; max-width:460px; margin-left:auto; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none; }
  #search{
    width:100%; padding:9px 12px 9px 34px; border-radius:9px; border:1px solid var(--border-strong);
    background:var(--surface-alt); color:var(--text); font-size:13.5px; font-family:var(--body-font);
    outline:none; transition:border-color .12s, box-shadow .12s;
  }
  #search:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--surface); }
  #search::placeholder{ color:var(--faint); }
  .search-clear{
    position:absolute; right:7px; top:50%; transform:translateY(-50%);
    border:none; background:none; color:var(--faint); cursor:pointer; padding:4px 6px; border-radius:5px;
    font-size:16px; line-height:1; display:none;
  }
  .search-clear:hover{ background:var(--border); color:var(--text); }

  .theme-toggle{
    flex:0 0 auto; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--muted);
    width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle:hover{ color:var(--text); border-color:var(--accent); }

  /* ---------- Shell ---------- */
  .shell{ flex:1 1 auto; display:flex; min-height:0; }

  /* ---------- Sidebar / tree ---------- */
  .sidebar{
    width:380px; flex:0 0 auto; border-right:1px solid var(--border);
    background:var(--surface); display:flex; flex-direction:column; min-width:260px;
    resize:horizontal; overflow:hidden; max-width:560px;
  }
  .sidebar-head{
    padding:10px 14px 6px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  }
  .sidebar-head .label{ font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); }
  .sidebar-head .mini-btn{
    font-size:11px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:6px;
    padding:3px 8px; cursor:pointer;
  }
  .sidebar-head .mini-btn:hover{ color:var(--text); border-color:var(--border-strong); }
  .tree-scroll{ flex:1 1 auto; overflow-y:auto; padding:4px 8px 16px; }

  ul.tree, ul.tree ul{ list-style:none; margin:0; padding:0; }
  ul.tree ul{ padding-left:16px; border-left:1px solid var(--border); margin-left:9px; }
  .node{ position:relative; }
  .row{
    display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:7px; cursor:pointer;
    font-size:13px; line-height:1.3; user-select:none;
  }
  .row:hover{ background:var(--surface-alt); }
  .row.selected{ background:var(--accent-soft); }
  .row.selected .name{ color:var(--accent-strong); font-weight:700; }
  .twisty{
    flex:0 0 auto; width:15px; height:15px; display:flex; align-items:center; justify-content:center;
    color:var(--faint); transition:transform .12s;
  }
  .node.expanded > .row .twisty{ transform:rotate(90deg); }
  .node > ul.tree{ display:none; }
  .node.expanded > ul.tree{ display:block; }
  .twisty.leafspot{ visibility:hidden; }
  .tier-dot{ flex:0 0 auto; width:7px; height:7px; border-radius:2px; }
  .name{ flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .code{ flex:0 0 auto; font-family:var(--code-font); font-size:10.5px; color:var(--faint); }
  .childcount{ flex:0 0 auto; font-family:var(--code-font); font-size:10px; color:var(--faint); background:var(--surface-alt); border:1px solid var(--border); padding:1px 5px; border-radius:9px; }
  ul.tree > .node > .row{ font-weight:600; }

  .tier-1{ background:var(--accent-strong); }
  .tier-2{ background:var(--accent); }
  .tier-3{ background:#7b8fe0; }
  .tier-4{ background:#a9b6ea; }
  .tier-5{ background:#8890a2; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tier-3{ background:#8fa1ec; }
    :root:not([data-theme="light"]) .tier-4{ background:#5a6595; }
    :root:not([data-theme="light"]) .tier-5{ background:#5b637c; }
  }
  :root[data-theme="dark"] .tier-3{ background:#8fa1ec; }
  :root[data-theme="dark"] .tier-4{ background:#5a6595; }
  :root[data-theme="dark"] .tier-5{ background:#5b637c; }

  /* search results list */
  .results-list{ padding:2px 6px; }
  .result-item{
    padding:8px 9px; border-radius:8px; cursor:pointer; margin-bottom:2px;
  }
  .result-item:hover{ background:var(--surface-alt); }
  .result-item .rname{ font-size:13px; font-weight:600; }
  .result-item .rpath{ font-size:11px; color:var(--faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .no-results{ padding:20px 14px; color:var(--faint); font-size:13px; text-align:center; }

  /* ---------- Main / detail pane ---------- */
  .main{ flex:1 1 auto; overflow-y:auto; min-width:0; }
  .detail{ max-width:880px; margin:0 auto; padding:28px 32px 80px; }

  .empty-state{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--faint); text-align:center; padding:40px; gap:10px;
  }
  .empty-state svg{ opacity:.5; margin-bottom:6px; }
  .empty-state h2{ font-size:16px; color:var(--muted); margin:0; font-weight:700; }
  .empty-state p{ margin:0; font-size:13px; max-width:360px; }

  .breadcrumb{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; font-size:12px; color:var(--faint); margin-bottom:14px; }
  .breadcrumb .crumb{ cursor:pointer; }
  .breadcrumb .crumb:hover{ color:var(--accent); text-decoration:underline; }
  .breadcrumb .sep{ opacity:.5; }

  .detail-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:6px; }
  .tier-pill{
    flex:0 0 auto; font-family:var(--code-font); font-size:11px; font-weight:600; letter-spacing:.03em;
    padding:4px 9px; border-radius:6px; color:#fff; margin-top:3px;
  }
  .detail-head h2{ font-size:24px; margin:0 0 4px; font-weight:800; letter-spacing:-.015em; text-wrap:balance; }
  .detail-code{ font-family:var(--code-font); font-size:12.5px; color:var(--muted); }

  .status-flag{ font-size:11px; padding:2px 7px; border-radius:5px; background:var(--warn-soft); color:var(--warn); font-weight:600; margin-left:8px; }

  .definition{
    font-family:var(--read-font); font-size:16.5px; line-height:1.6; color:var(--text);
    margin:16px 0 0; max-width:66ch;
  }
  .lede-muted{ color:var(--muted); font-size:14px; margin-top:10px; max-width:66ch; line-height:1.55; }

  .section{ margin-top:30px; }
  .section > h3{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--faint);
    margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section > h3::after{ content:""; flex:1 1 auto; height:1px; background:var(--border); }

  /* children card grid (non-leaf) */
  .child-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .child-card{
    border:1px solid var(--border); border-radius:10px; padding:12px 13px; background:var(--surface);
    cursor:pointer; transition:border-color .12s, transform .12s; box-shadow:var(--shadow);
  }
  .child-card:hover{ border-color:var(--accent); }
  .child-card .cc-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .child-card .code{ font-size:10.5px; }
  .child-card .name{ font-size:13.5px; font-weight:600; white-space:normal; color:var(--text); line-height:1.35; }
  .child-card .cc-meta{ margin-top:8px; font-size:11px; color:var(--faint); display:flex; gap:8px; }

  /* stat row (severity/priority/escalation) */
  .fact-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .fact{
    flex:1 1 210px; border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--surface-alt);
  }
  .fact .flabel{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:700; margin-bottom:4px; }
  .fact .fval{ font-size:13px; line-height:1.45; color:var(--text); }
  .sev-badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; margin-bottom:4px; }
  .sev-low{ background:var(--good-soft); color:var(--good); }
  .sev-med{ background:var(--warn-soft); color:var(--warn); }
  .sev-high{ background:var(--bad-soft); color:var(--bad); }

  .cols2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:640px){ .cols2{ grid-template-columns:1fr; } }
  .cols2 h4{ font-size:12px; font-weight:700; color:var(--muted); margin:0 0 8px; }
  ul.plain{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
  ul.plain li{ font-size:13px; line-height:1.5; padding-left:16px; position:relative; }
  ul.plain.incl li::before{ content:"+"; position:absolute; left:0; color:var(--good); font-weight:700; }
  ul.plain.excl li::before{ content:"–"; position:absolute; left:0; color:var(--bad); font-weight:700; }
  ul.plain.dot li::before{ content:"•"; position:absolute; left:2px; color:var(--faint); }

  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ font-family:var(--code-font); font-size:11px; padding:3px 8px; border-radius:5px; background:var(--surface-alt); border:1px solid var(--border); color:var(--muted); }
  .tag.mitre{ background:var(--accent-soft); border-color:var(--accent-soft-2); color:var(--accent-strong); }

  .prose{ font-size:13.5px; line-height:1.6; color:var(--text); }
  .prose + .prose{ margin-top:8px; }

  /* playbook */
  .pb-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .pb-head h4{ font-size:15px; margin:0; font-weight:700; }
  .pb-desc{ font-size:13px; color:var(--muted); margin-top:4px; max-width:70ch; line-height:1.5; }

  .timeline{ margin-top:18px; display:flex; flex-direction:column; }
  .step{ display:flex; gap:14px; position:relative; }
  .step .railcol{ flex:0 0 auto; width:26px; display:flex; flex-direction:column; align-items:center; }
  .step .dot{
    width:11px; height:11px; border-radius:50%; background:var(--surface); border:2px solid var(--accent);
    margin-top:5px; flex:0 0 auto; z-index:1;
  }
  .step .rail{ width:1.5px; flex:1 1 auto; background:var(--border); margin-top:2px; }
  .step:last-child .rail{ display:none; }
  .step-body{ flex:1 1 auto; padding-bottom:22px; }
  .step-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px; }
  .step-order{ font-family:var(--code-font); font-size:11px; color:var(--faint); }
  .phase-badge{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:5px; }
  .phase-identification{ background:#e8ecfd; color:#3454d1; }
  .phase-containment{ background:var(--warn-soft); color:var(--warn); }
  .phase-eradication{ background:var(--bad-soft); color:var(--bad); }
  .phase-recovery{ background:var(--good-soft); color:var(--good); }
  .phase-lessons_learned{ background:var(--surface-alt); color:var(--muted); border:1px solid var(--border); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .phase-identification{ background:var(--accent-soft); color:var(--accent-strong); } }
  :root[data-theme="dark"] .phase-identification{ background:var(--accent-soft); color:var(--accent-strong); }
  .step-type{ font-size:10.5px; color:var(--faint); font-family:var(--code-font); }
  .req-flag{ font-size:10px; font-weight:700; color:var(--bad); }
  .step-title{ font-size:14px; font-weight:700; margin:2px 0 4px; }
  .step-desc{ font-size:13px; color:var(--text); line-height:1.55; }
  .step-extra{ margin-top:6px; font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:3px; }
  .step-extra b{ color:var(--muted); font-weight:600; }
  .step-tool{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); margin-top:6px; font-family:var(--code-font); }
  .step-tool svg{ opacity:.7; }

  .loading-row{ display:flex; align-items:center; gap:10px; color:var(--faint); font-size:13px; padding:30px 0; }
  .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation-duration:1.6s; } }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--faint); }

  @media (max-width:760px){
    .sidebar{ width:100%; max-width:none; position:absolute; inset:0; z-index:5; transform:translateX(0); transition:transform .18s; }
    .sidebar.hide-mobile{ transform:translateX(-100%); }
    .shell{ position:relative; }
    .detail{ padding:20px 16px 60px; }
    .mobile-back{ display:inline-flex !important; }
  }
  .mobile-back{ display:none; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--text); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; align-items:center; gap:6px; }
</style>

<div class="topbar">
  <button class="mobile-back" id="mobileBack" hidden>☰ Browse</button>
  <div class="brand">
    <span class="mark">ITID</span>
    <div>
      <h1>Taxonomy Explorer</h1>
    </div>
  </div>
  <div class="stats" id="statsRow"></div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search codes, techniques, names…" autocomplete="off" spellcheck="false">
    <button class="search-clear" id="searchClear" title="Clear">×</button>
  </div>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle color theme">
    <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="label" id="sidebarLabel">Domains</span>
      <button class="mini-btn" id="collapseAll">Collapse all</button>
    </div>
    <div class="tree-scroll" id="treeScroll">
      <ul class="tree" id="treeRoot"></ul>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty-state" id="emptyState">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
      <h2>Browse the ITID taxonomy</h2>
      <p>Select a category on the left to see its scope, or drill into a leaf classification for its full definition, MITRE mapping, and response playbook.</p>
    </div>
    <div class="detail" id="detail" hidden></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ---------------- Theme ----------------
  var root = document.documentElement;
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem('itid-theme'); }catch(e){}
  if(savedTheme === 'light' || savedTheme === 'dark'){ root.setAttribute('data-theme', savedTheme); }
  function currentIsDark(){
    var explicit = root.getAttribute('data-theme');
    if(explicit === 'dark') return true;
    if(explicit === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintThemeIcon(){
    var icon = document.getElementById('themeIcon');
    if(currentIsDark()){
      icon.innerHTML = '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
  }
  paintThemeIcon();
  document.getElementById('themeToggle').addEventListener('click', function(){
    var next = currentIsDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('itid-theme', next); }catch(e){}
    paintThemeIcon();
  });

  // ---------------- State ----------------
  var CODE_INDEX = Object.create(null);   // code -> node ref (augmented)
  var FLAT = [];                          // search index
  var DETAIL_CACHE = Object.create(null); // domainCode -> parsed shard
  var expanded = Object.create(null);
  var selectedCode = null;
  var domainList = [];

  var treeRoot = document.getElementById('treeRoot');
  var detailEl = document.getElementById('detail');
  var emptyState = document.getElementById('emptyState');
  var mainEl = document.getElementById('main');
  var searchInput = document.getElementById('search');
  var searchClear = document.getElementById('searchClear');
  var sidebarLabel = document.getElementById('sidebarLabel');

  function esc(s){
    if(s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------------- Load tree ----------------
  fetch('tree.json').then(function(r){ return r.json(); }).then(function(domains){
    domainList = domains;
    indexTree(domains);
    renderStats();
    renderTree();
  }).catch(function(err){
    treeRoot.innerHTML = '<li style="padding:16px;color:var(--bad);font-size:13px;">Failed to load taxonomy data: ' + esc(err.message) + '</li>';
  });

  function indexTree(domains){
    domains.forEach(function(domain){
      walk(domain, null, domain.i, []);
    });
    function walk(node, parentCode, domainCode, pathNames){
      node._parent = parentCode;
      node._domain = domainCode;
      node._path = pathNames;
      CODE_INDEX[node.i] = node;
      var myPath = pathNames.concat([node.n]);
      var leafCount = 0;
      if(node.c && node.c.length){
        node.c.forEach(function(child){
          leafCount += walk(child, node.i, domainCode, myPath);
        });
      } else if(node.leaf){
        leafCount = 1;
      }
      node._leafCount = leafCount;
      FLAT.push({ i: node.i, n: node.n, t: node.t, leaf: !!node.leaf, path: pathNames.join(' / ') });
      return leafCount;
    }
  }

  function renderStats(){
    var byTier = {};
    FLAT.forEach(function(f){ byTier[f.t] = (byTier[f.t]||0)+1; });
    var leaves = byTier[5] || 0;
    var row = document.getElementById('statsRow');
    row.innerHTML =
      '<span class="stat-chip"><b>' + FLAT.length + '</b> nodes</span>' +
      '<span class="stat-chip"><b>' + (byTier[1]||0) + '</b> domains</span>' +
      '<span class="stat-chip"><b>' + leaves + '</b> classifications</span>';
  }

  // ---------------- Tree rendering ----------------
  function tierColor(t){ return 'tier-' + t; }

  function renderTree(){
    treeRoot.innerHTML = '';
    domainList.forEach(function(node){
      treeRoot.appendChild(buildNodeLi(node));
    });
  }

  function buildNodeLi(node){
    var li = document.createElement('li');
    li.className = 'node';
    li.dataset.code = node.i;
    var hasChildren = node.c && node.c.length;
    var isExpanded = !!expanded[node.i];
    if(isExpanded) li.classList.add('expanded');

    var row = document.createElement('div');
    row.className = 'row' + (node.i === selectedCode ? ' selected' : '');
    row.dataset.code = node.i;

    var twisty = document.createElement('span');
    twisty.className = 'twisty' + (hasChildren ? '' : ' leafspot');
    twisty.innerHTML = hasChildren ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>' : '';

    var dot = document.createElement('span');
    dot.className = 'tier-dot ' + tierColor(node.t);

    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = node.n;
    name.title = node.n;

    row.appendChild(twisty);
    row.appendChild(dot);
    row.appendChild(name);

    if(hasChildren){
      var cc = document.createElement('span');
      cc.className = 'childcount';
      cc.textContent = node.c.length;
      row.appendChild(cc);
    } else {
      var code = document.createElement('span');
      code.className = 'code';
      code.textContent = node.i.replace('ITID-','');
      row.appendChild(code);
    }

    row.addEventListener('click', function(){
      if(hasChildren){ toggleExpand(node.i, li); }
      selectNode(node.i);
    });

    li.appendChild(row);

    if(hasChildren){
      var ul = document.createElement('ul');
      ul.className = 'tree';
      if(isExpanded){
        node.c.forEach(function(child){ ul.appendChild(buildNodeLi(child)); });
      }
      li.appendChild(ul);
    }
    return li;
  }

  function toggleExpand(code, li){
    var node = CODE_INDEX[code];
    var willExpand = !expanded[code];
    expanded[code] = willExpand;
    li.classList.toggle('expanded', willExpand);
    var ul = li.querySelector(':scope > ul.tree');
    if(willExpand && ul && ul.children.length === 0){
      node.c.forEach(function(child){ ul.appendChild(buildNodeLi(child)); });
    }
  }

  function expandPathTo(code){
    var node = CODE_INDEX[code];
    if(!node) return;
    var chain = [];
    var cur = node._parent;
    while(cur){ chain.unshift(cur); cur = CODE_INDEX[cur]._parent; }
    chain.forEach(function(c){ expanded[c] = true; });
  }

  document.getElementById('collapseAll').addEventListener('click', function(){
    expanded = Object.create(null);
    renderTree();
  });

  // ---------------- Search ----------------
  var searchMode = false;
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    searchClear.style.display = q ? 'block' : 'none';
    if(!q){ exitSearch(); return; }
    searchMode = true;
    sidebarLabel.textContent = 'Search results';
    var terms = q.split(/\s+/);
    var matches = FLAT.filter(function(f){
      var hay = (f.i + ' ' + f.n).toLowerCase();
      return terms.every(function(t){ return hay.indexOf(t) !== -1; });
    }).slice(0, 200);
    renderResults(matches, q);
  });
  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    searchClear.style.display = 'none';
    exitSearch();
    searchInput.focus();
  });
  function exitSearch(){
    searchMode = false;
    sidebarLabel.textContent = 'Domains';
    renderTree();
  }

  function renderResults(matches, q){
    treeRoot.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'results-list';
    if(!matches.length){
      wrap.innerHTML = '<div class="no-results">No matches for “' + esc(q) + '”</div>';
    } else {
      matches.forEach(function(f){
        var item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML =
          '<div class="rname"><span class="tier-dot ' + tierColor(f.t) + '" style="display:inline-block;margin-right:6px;vertical-align:2px;"></span>' + esc(f.n) + '</div>' +
          '<div class="rpath">' + esc(f.i) + (f.path ? '  ·  ' + esc(f.path) : '') + '</div>';
        item.addEventListener('click', function(){
          searchInput.value = '';
          searchClear.style.display = 'none';
          searchMode = false;
          sidebarLabel.textContent = 'Domains';
          expandPathTo(f.i);
          renderTree();
          selectNode(f.i);
          highlightAndScroll(f.i);
          if(window.innerWidth <= 760) setMobileTree(false);
        });
        wrap.appendChild(item);
      });
    }
    treeRoot.parentElement.appendChild(wrap);
    treeRoot.style.display = 'none';
  }
  // restore treeRoot display when leaving search
  var _origRenderTree = renderTree;
  renderTree = function(){
    var extra = document.querySelector('.results-list');
    if(extra) extra.remove();
    treeRoot.style.display = '';
    _origRenderTree();
  };

  function highlightAndScroll(code){
    requestAnimationFrame(function(){
      var row = treeRoot.querySelector('.row[data-code="' + cssEscape(code) + '"]');
      if(row) row.scrollIntoView({block:'center'});
    });
  }
  function cssEscape(s){ return s.replace(/[^a-zA-Z0-9_-]/g, function(c){ return '\\' + c; }); }

  // ---------------- Selection / detail ----------------
  function selectNode(code){
    selectedCode = code;
    document.querySelectorAll('.row.selected').forEach(function(r){ r.classList.remove('selected'); });
    var row = treeRoot.querySelector('.row[data-code="' + cssEscape(code) + '"]');
    if(row) row.classList.add('selected');

    emptyState.hidden = true;
    detailEl.hidden = false;
    var node = CODE_INDEX[code];
    mainEl.scrollTop = 0;

    if(node.leaf){
      renderLoading();
      loadDomainShard(node._domain).then(function(shard){
        renderLeafDetail(node, shard[node.i]);
      }).catch(function(err){
        detailEl.innerHTML = '<div class="breadcrumb">' + breadcrumbHTML(node) + '</div>' +
          '<p class="lede-muted" style="color:var(--bad);">Could not load detail data (' + esc(err.message) +
          '). If you opened this file directly from disk, serve it from a local web server instead (e.g. <code>npx serve .</code> or <code>python -m http.server</code>) — browsers block fetching local JSON files over file://.</p>';
        attachBreadcrumbHandlers();
      });
    } else {
      renderBranchDetail(node);
    }
    if(window.innerWidth <= 760) setMobileTree(false);
  }

  function renderLoading(){
    detailEl.innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading classification detail…</div>';
  }

  function loadDomainShard(domainCode){
    if(DETAIL_CACHE[domainCode]) return Promise.resolve(DETAIL_CACHE[domainCode]);
    return fetch('details/' + domainCode + '.json').then(function(r){ return r.json(); }).then(function(data){
      DETAIL_CACHE[domainCode] = data;
      return data;
    });
  }

  function breadcrumbHTML(node){
    var parts = node._path.map(function(n, i){ return n; });
    var codes = [];
    var cur = node;
    var chain = [];
    while(cur){ chain.unshift(cur); cur = cur._parent ? CODE_INDEX[cur._parent] : null; }
    var html = chain.map(function(n, i){
      var isLast = i === chain.length - 1;
      return '<span class="crumb" data-code="' + esc(n.i) + '"' + (isLast?' style="color:var(--text);font-weight:600;pointer-events:none;"':'') + '>' + esc(n.n) + '</span>' + (isLast ? '' : '<span class="sep">/</span>');
    }).join('');
    return html;
  }

  function attachBreadcrumbHandlers(){
    detailEl.querySelectorAll('.crumb[data-code]').forEach(function(el){
      el.addEventListener('click', function(){
        var code = el.dataset.code;
        expandPathTo(code);
        renderTree();
        selectNode(code);
        highlightAndScroll(code);
      });
    });
  }

  function tierLabel(t){
    return ['', 'Domain', 'Category', 'Subcategory', 'Type', 'Classification'][t] || ('Tier ' + t);
  }

  function renderBranchDetail(node){
    var childrenHtml = '';
    if(node.c && node.c.length){
      childrenHtml = '<div class="section"><h3>' + (node.t === 1 ? 'Categories' : (node.t === 4 ? 'Classifications' : 'Subcategories')) + '</h3><div class="child-grid">' +
        node.c.map(function(child){
          var descLeaf = child._leafCount;
          return '<div class="child-card" data-code="' + esc(child.i) + '">' +
            '<div class="cc-top"><span class="tier-dot ' + tierColor(child.t) + '"></span><span class="code">' + esc(child.i) + '</span></div>' +
            '<div class="name">' + esc(child.n) + '</div>' +
            '<div class="cc-meta">' + (child.c && child.c.length ? child.c.length + ' items' : '') + (descLeaf ? ' · ' + descLeaf + ' leaf' + (descLeaf===1?'':'ves') : '') + '</div>' +
            '</div>';
        }).join('') + '</div></div>';
    }

    detailEl.innerHTML =
      '<div class="breadcrumb">' + breadcrumbHTML(node) + '</div>' +
      '<div class="detail-head">' +
        '<span class="tier-pill ' + tierColor(node.t) + '">' + tierLabel(node.t) + '</span>' +
        '<div><h2>' + esc(node.n) + '</h2><div class="detail-code">' + esc(node.i) + '</div></div>' +
      '</div>' +
      (node.d ? '<p class="definition">' + esc(node.d) + '</p>' : '<p class="lede-muted">No definition recorded for this category. Browse its ' + (node.t===1?'categories':'subcategories') + ' below.</p>') +
      '<p class="lede-muted">' + node._leafCount + ' leaf classification' + (node._leafCount===1?'':'s') + ' beneath this node.</p>' +
      childrenHtml;

    detailEl.querySelectorAll('.child-card').forEach(function(el){
      el.addEventListener('click', function(){
        var code = el.dataset.code;
        expandPathTo(code);
        expanded[code] = true;
        renderTree();
        selectNode(code);
        highlightAndScroll(code);
      });
    });
    attachBreadcrumbHandlers();
  }

  function sevClass(text){
    if(!text) return 'sev-med';
    var s = text.toLowerCase();
    var hasHigh = s.indexOf('high') !== -1;
    var hasLow = s.indexOf('low') !== -1;
    if(hasHigh && !s.match(/low-to-|low to/)) return 'sev-high';
    if(hasLow && s.indexOf('high') === -1) return 'sev-low';
    return 'sev-med';
  }

  function listHtml(arr, cls){
    if(!arr || !arr.length) return '';
    return '<ul class="plain ' + cls + '">' + arr.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  function tagsHtml(arr, extraCls){
    if(!arr || !arr.length) return '<span class="lede-muted" style="margin:0;font-size:12px;">None mapped</span>';
    return '<div class="tag-row">' + arr.map(function(x){ return '<span class="tag' + (extraCls?' '+extraCls:'') + '">' + esc(x) + '</span>'; }).join('') + '</div>';
  }

  var PHASE_LABEL = { identification:'Identification', containment:'Containment', eradication:'Eradication', recovery:'Recovery', lessons_learned:'Lessons Learned' };

  function renderLeafDetail(node, d){
    if(!d){
      detailEl.innerHTML = '<div class="breadcrumb">' + breadcrumbHTML(node) + '</div><p class="lede-muted">No extended detail found for this classification.</p>';
      attachBreadcrumbHandlers();
      return;
    }
    var html = '';
    html += '<div class="breadcrumb">' + breadcrumbHTML(node) + '</div>';
    html += '<div class="detail-head">' +
        '<span class="tier-pill ' + tierColor(5) + '">Classification</span>' +
        '<div><h2>' + esc(node.n) + '</h2><div class="detail-code">' + esc(node.i) + '</div></div>' +
      '</div>';

    if(d.def) html += '<p class="definition">' + esc(d.def) + '</p>';
    if(d.purpose) html += '<p class="lede-muted"><strong style="color:var(--muted);">Purpose — </strong>' + esc(d.purpose) + '</p>';

    // fact row
    html += '<div class="section"><h3>Triage Guidance</h3><div class="fact-row">';
    html += '<div class="fact"><div class="flabel">Severity</div><div class="fval"><span class="sev-badge ' + sevClass(d.severity) + '">' + (d.severity ? esc(d.severity) : '—') + '</span></div></div>';
    html += '<div class="fact"><div class="flabel">Priority</div><div class="fval">' + (d.priority ? esc(d.priority) : '—') + '</div></div>';
    html += '<div class="fact"><div class="flabel">Escalation</div><div class="fval">' + (d.escalation ? esc(d.escalation) : '—') + '</div></div>';
    html += '</div></div>';

    if((d.scopeIncludes && d.scopeIncludes.length) || (d.scopeExcludes && d.scopeExcludes.length)){
      html += '<div class="section"><h3>Scope</h3><div class="cols2">' +
        '<div><h4>In scope</h4>' + (listHtml(d.scopeIncludes, 'incl') || '<p class="prose" style="color:var(--faint);">—</p>') + '</div>' +
        '<div><h4>Out of scope</h4>' + (listHtml(d.scopeExcludes, 'excl') || '<p class="prose" style="color:var(--faint);">—</p>') + '</div>' +
        '</div></div>';
    }

    if((d.indicators && d.indicators.length) || (d.vectors && d.vectors.length) || (d.rootCauses && d.rootCauses.length)){
      html += '<div class="section"><h3>Indicators &amp; Causes</h3><div class="cols2">';
      html += '<div><h4>Typical indicators</h4>' + (listHtml(d.indicators, 'dot') || '<p class="prose" style="color:var(--faint);">—</p>') + '</div>';
      html += '<div><h4>Attack vectors</h4>' + (listHtml(d.vectors, 'dot') || '<p class="prose" style="color:var(--faint);">—</p>') + '</div>';
      html += '</div>';
      if(d.rootCauses && d.rootCauses.length){
        html += '<div style="margin-top:16px;"><h4>Common root causes</h4>' + listHtml(d.rootCauses, 'dot') + '</div>';
      }
      html += '</div>';
    }

    if((d.mitreTactics && d.mitreTactics.length) || (d.mitreTechniques && d.mitreTechniques.length) || (d.controls && d.controls.length)){
      html += '<div class="section"><h3>MITRE &amp; Controls</h3>';
      if(d.mitreTactics && d.mitreTactics.length){ html += '<div style="margin-bottom:12px;"><h4 style="margin-bottom:6px;">ATT&amp;CK tactics</h4>' + tagsHtml(d.mitreTactics, 'mitre') + '</div>'; }
      if(d.mitreTechniques && d.mitreTechniques.length){ html += '<div style="margin-bottom:12px;"><h4 style="margin-bottom:6px;">ATT&amp;CK techniques</h4>' + tagsHtml(d.mitreTechniques, 'mitre') + '</div>'; }
      if(d.controls && d.controls.length){ html += '<div><h4 style="margin-bottom:6px;">Mapped controls</h4>' + tagsHtml(d.controls) + '</div>'; }
      html += '</div>';
    }

    if(d.detection || d.response){
      html += '<div class="section"><h3>Detection &amp; Response</h3><div class="cols2">';
      html += '<div><h4>Detection coverage</h4><p class="prose">' + (d.detection ? esc(d.detection) : '—') + '</p></div>';
      html += '<div><h4>Response expectations</h4><p class="prose">' + (d.response ? esc(d.response) : '—') + '</p></div>';
      html += '</div></div>';
    }

    if((d.metrics && d.metrics.length) || (d.sops && d.sops.length) || (d.detections && d.detections.length)){
      html += '<div class="section"><h3>Operational References</h3><div class="cols2">';
      html += '<div><h4>Metrics tracked</h4>' + (listHtml(d.metrics, 'dot') || '<p class="prose" style="color:var(--faint);">—</p>') + '</div>';
      html += '<div><h4>Related SOPs / detections</h4>' + (listHtml((d.sops||[]).concat(d.detections||[]), 'dot') || '<p class="prose" style="color:var(--faint);">—</p>') + '</div>';
      html += '</div></div>';
    }

    if(d.notes){
      html += '<div class="section"><h3>Notes</h3><p class="prose">' + esc(d.notes) + '</p></div>';
    }

    if(d.tags && d.tags.length){
      html += '<div class="section"><h3>Tags</h3>' + tagsHtml(d.tags) + '</div>';
    }

    if(d.playbook){
      html += '<div class="section"><h3>Response Playbook</h3>';
      html += '<div class="pb-head"><h4>' + esc(d.playbook.name) + '</h4></div>';
      if(d.playbook.description) html += '<p class="pb-desc">' + esc(d.playbook.description) + '</p>';
      html += '<div class="timeline">';
      (d.playbook.steps || []).forEach(function(s, i){
        html += '<div class="step">' +
          '<div class="railcol"><div class="dot"></div><div class="rail"></div></div>' +
          '<div class="step-body">' +
            '<div class="step-top">' +
              '<span class="step-order">STEP ' + (i+1) + '</span>' +
              '<span class="phase-badge phase-' + esc(s.phase||'') + '">' + esc(PHASE_LABEL[s.phase] || s.phase || '') + '</span>' +
              '<span class="step-type">' + esc(s.type||'') + '</span>' +
              (s.required ? '<span class="req-flag">REQUIRED</span>' : '') +
            '</div>' +
            '<div class="step-title">' + esc(s.title) + '</div>' +
            (s.desc ? '<div class="step-desc">' + esc(s.desc) + '</div>' : '') +
            '<div class="step-extra">' +
              (s.guidance ? '<div><b>Guidance:</b> ' + esc(s.guidance) + '</div>' : '') +
              (s.outcome ? '<div><b>Expected outcome:</b> ' + esc(s.outcome) + '</div>' : '') +
              (s.abort ? '<div><b>If blocked:</b> ' + esc(s.abort) + '</div>' : '') +
            '</div>' +
            (s.tool ? '<div class="step-tool"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 01-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 015.4-5.4z"/></svg>' + esc(s.tool) + '</div>' : '') +
          '</div>' +
        '</div>';
      });
      html += '</div></div>';
    }

    detailEl.innerHTML = html;
    attachBreadcrumbHandlers();
  }

  // ---------------- Mobile sidebar toggle ----------------
  var sidebarEl = document.getElementById('sidebar');
  var mobileBack = document.getElementById('mobileBack');
  function setMobileTree(show){
    if(show){ sidebarEl.classList.remove('hide-mobile'); }
    else { sidebarEl.classList.add('hide-mobile'); }
  }
  if(window.innerWidth <= 760){
    mobileBack.hidden = false;
  }
  window.addEventListener('resize', function(){ mobileBack.hidden = window.innerWidth > 760; });
  mobileBack.addEventListener('click', function(){ setMobileTree(true); });

})();
</script>
